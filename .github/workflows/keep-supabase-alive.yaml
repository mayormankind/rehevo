name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every Monday and Thursday (twice a week to comfortably beat the 7-day pause limit)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allows you to manually trigger the ping whenever you want

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat Ping to Supabase API
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_URL="${SUPABASE_URL#*=}"
          SUPABASE_URL="${SUPABASE_URL#\"}"
          SUPABASE_URL="${SUPABASE_URL%\"}"
          SUPABASE_URL="${SUPABASE_URL#\'}"
          SUPABASE_URL="${SUPABASE_URL%\'}"
          SUPABASE_URL="${SUPABASE_URL%/}"

          if [[ "$SUPABASE_URL" != http://* && "$SUPABASE_URL" != https://* ]]; then
            SUPABASE_URL="https://${SUPABASE_URL}"
          fi

          curl --retry 5 --retry-all-errors --retry-delay 2 --fail-with-body -i -X GET "${SUPABASE_URL}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"